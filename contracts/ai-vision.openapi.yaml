openapi: 3.1.0
info:
  title: Smart Campus — AI Vision & Camera Detection Service
  description: |
    Hợp đồng API chuẩn hóa kết nối giữa luồng Camera Stream, Core Business và Dịch vụ nhận diện AI (AI Vision).
    Phiên bản v2.0 tích hợp cơ chế kiểm soát vòng đời API, phân trang con trỏ nâng cao và Webhook sự kiện.
  version: 2.0.0

servers:
  - url: http://localhost:4010
    description: Prism Mock Server mặc định phục vụ chạy thử nghiệm Newman Contract Tests

paths:
  /api/v2/vision/detections:
    get:
      operationId: listDetectionsV2
      summary: Lấy danh sách lịch sử nhận diện AI (Hỗ trợ Cursor Pagination)
      description: |
        Endpoint nâng cấp v2.0 để lấy lịch sử nhận diện (khuôn mặt, biển số xe). 
        Sử dụng cơ chế con trỏ (Cursor) để tránh tình trạng quá tải hệ thống khi dữ liệu lớn.
      tags:
        - AI Detection v2
      parameters:
        - name: limit
          in: query
          required: false
          description: Số lượng bản ghi nhận diện tối đa trả về trên một trang
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: starting_after
          in: query
          required: false
          description: Con trỏ (ID của bản ghi nhận diện) dùng để lấy trang tiếp theo
          schema:
            type: string
            pattern: '^DET-[a-fA-F0-9]{8}$'
            example: 'DET-a1b2c3d4'
      responses:
        '200':
          description: Trả về danh sách nhận diện kèm thông tin phân trang con trỏ
          headers:
            X-Idempotency-Key:
              description: Khóa chống trùng lặp xử lý nhằm đảm bảo tính toàn vẹn dữ liệu
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data, hasMore, nextCursor]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DetectionLog'
                  hasMore:
                    type: boolean
                    description: Đánh dấu xem còn trang tiếp theo để tải hay không
                  nextCursor:
                    type: [string, "null"]
                    description: Giá trị ID dùng làm tham số starting_after cho request tiếp theo
                    example: 'DET-e7d7d4f1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/vision/detect:
    post:
      operationId: runDetectionV1
      summary: [DEPRECATED] Nhận diện hình ảnh thời gian thực phiên bản v1.0
      deprecated: true
      description: |
        Endpoint xử lý nhận diện cũ v1.0. Hiện tại endpoint này đã bị đánh dấu lỗi thời (Deprecated) 
        và sẽ chính thức ngừng hoạt động (Sunset) vào ngày quy định. Hãy chuyển sang sử dụng v2.
      tags:
        - AI Detection v1 (Legacy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cameraId, imageRaw]
              properties:
                cameraId:
                  type: string
                imageRaw:
                  type: string
      responses:
        '200':
          description: Xử lý thành công nhưng có kèm thông tin vòng đời API
          headers:
            Sunset:
              description: Ngày chính thức gỡ bỏ endpoint v1 hoàn toàn khỏi hệ thống (RFC 8594)
              schema:
                type: string
                example: "Wed, 11 Nov 2026 23:59:59 GMT"
            Link:
              description: Đường dẫn tài liệu hướng dẫn chuyển đổi tích hợp lên phiên bản v2
              schema:
                type: string
                example: '<http://localhost:4010/api/v2/vision/detections>; rel="successor-version"'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "DEPRECATED_WARNING"

webhooks:
  onAnomalousDetection:
    post:
      summary: Webhook cảnh báo đối tượng bất thường hoặc xâm nhập trái phép
      description: |
        Mô hình Event bất đồng bộ. AI Vision tự động kích hoạt bắn tín hiệu webhook này về 
        Core Business/Notification Service ngay khi phát hiện khuôn mặt nằm trong danh sách đen (Blacklist).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, alertType, confidence, timestamp]
              additionalProperties: false
              properties:
                eventId:
                  type: string
                  format: uuid
                  example: "c3b9a2d1-4e8f-4b9a-bc2d-1a8f3b7d6e5c"
                alertType:
                  type: string
                  enum: [INTRUDER_ALERT, BLACKLIST_MATCH, UNKNOWN_PERSON]
                  example: "BLACKLIST_MATCH"
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  example: 0.96
                timestamp:
                  type: string
                  format: date-time
                  example: "2026-06-11T11:30:00Z"
      responses:
        '200':
          description: Hệ thống trung tâm nhận được cảnh báo an ninh và xử lý thành công.

components:
  schemas:
    DetectionLog:
      type: object
      required: [detectionId, cameraId, targetType, timestamp]
      additionalProperties: false
      properties:
        detectionId:
          type: string
          pattern: '^DET-[a-fA-F0-9]{8}$'
          example: 'DET-a1b2c3d4'
        cameraId:
          type: string
          example: 'CAM-GATE-01'
        targetType:
          type: string
          enum: [FACE, LICENSE_PLATE, UNKNOWN]
          example: 'FACE'
        metaData:
          type: [string, "null"]
          maxLength: 255
          example: 'MSSV: 1771020457'
        timestamp:
          type: string
          format: date-time

    Problem:
      type: object
      required: [type, title, status, detail, instance]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          example: 'https://api.smartcampus.edu.vn/probs/invalid-cursor'
        title:
          type: string
          example: 'Bad Request'
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: 'The provided pagination cursor is invalid or has expired.'
        instance:
          type: string
          example: '/api/v2/vision/detections'

  responses:
    BadRequest:
      description: Dữ liệu gửi lên không đúng định dạng hoặc sai Cursor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Thiếu thông tin hoặc sai mã xác thực Gateway kết nối
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Máy chủ dịch vụ AI Vision gặp sự cố xử lý thuật toán cục bộ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'